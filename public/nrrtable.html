<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="nrrtable.css">
    <title>NRR Table</title>
</head>

<body>
    <h1 class="topic">NRR Table of [Tournament Name]</h1>
    <div class="container">
        <p class="intro">This page displays the Net Run Rate (NRR) table for the cricket tournament based on the match results entered.</p>
    </div>

    <div class="table-container">
        <table id="nrrTable">
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Matches Played</th>
                    <th>Wins</th>
                    <th>Losses</th>
                    <th>Points</th>
                    <th>NRR</th>
                    <th>Runs Scored (Overs)</th>
                    <th>Runs Conceded (Overs)</th>
                </tr>
            </thead>
            <tbody>
                <!-- NRR data will be populated here -->
            </tbody>
        </table>
    </div>

    <script src="nrrtable.js"></script>
