<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="tournament.css">
    <title>Tournament Details</title>
</head>

<body>
    <header class="site-header">
        <a class="site-brand" href="/" aria-label="NRR Calculator home">
            <img src="nrr-logo.png" alt="NRR Calculator logo" class="site-logo">
            <span>NRR Calculator</span>
        </a>
    </header><h1 class="topic">Tournament Details</h1>
    <div class="container">
        <p class="intro">Welcome to the tournament page. Here you can manage and view details about your cricket tournament.</p>
    </div>

        <h1 id="tournamentName"></h1>
        <p id="tournamentDetails"></p>
    <div class="format-wrapper">
        <div class="container">
            <h2 class="sub-topic">Select Tournament Format</h2>
            <div class="format-options">
                <label class="radio-card">
                    <input type="radio" name="format" value="roundrobin" required>
                    <div class="card-content">
                        <h3>Round Robin</h3>
                        <p>Every team plays against each other</p>
                    </div>
                </label>

                <label class="radio-card">
                    <input type="radio" name="format" value="groups">
                    <div class="card-content">
                        <h3>Group Stage</h3>
                        <p>Teams are divided into groups</p>
                    </div>
                </label>
            </div>
        </div>

        <div class="group-options" id="groupOptions">
        <h4>Number of Groups</h4>

        <div class="group-buttons-wrapper">
            <div class="group-buttons" id="groupButtons">
            <label class="group-radio">
                <input type="radio" name="groupCount" value="2">
                <span>2</span>
            </label>

            <label class="group-radio">
                <input type="radio" name="groupCount" value="4">
                <span>4</span>
            </label>

            <label class="group-radio">
                <input type="radio" name="groupCount" value="8">
                <span>8</span>
            </label>

            <label class="group-radio">
                <input type="radio" name="groupCount" value="other">
                <span>Other</span>
            </label>
            </div>

            <!-- Hidden until needed -->
            <div class="other-inline" id="otherInput">
            <input type="number" min="2" placeholder="Groups" id="customGroupCount">
            </div>
        </div>
    </div>
    </div>

    <div id="teamInputsContainer"></div>
    <div id="errorMessage" class="error-message"></div>
    <div class="proceed-wrapper">
        <input type="button" value="Proceed" class="proceed-button" id="proceedButton" disabled>
    </div>

    <script src="app-config.js?v=2" defer></script>
    <script src="loading.js?v=2" defer></script>
    <script src="tournament-setup.js?v=2" defer></script>
</body>
</html>
